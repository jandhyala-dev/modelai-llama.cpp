name: ModelAI Upstream Sync

on:
  schedule:
    # Weekly Saturday 2PM PDT (21:00 UTC)
    - cron: '0 21 * * 6'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: upstream-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Fetch upstream
        run: |
          git remote add upstream https://github.com/ggml-org/llama.cpp.git || true
          git fetch upstream master
          git fetch origin modelai-main

      - name: Update upstream-master tracking branch
        run: |
          git branch -f upstream-master upstream/master
          git push origin upstream-master --force-with-lease

      - name: Reset upstream-sync to modelai-main + upstream
        id: merge
        run: |
          set -euo pipefail

          git checkout -B upstream-sync origin/modelai-main
          if git merge upstream/master --no-edit; then
            echo "conflict=false" >> "$GITHUB_OUTPUT"
          else
            echo "conflict=true" >> "$GITHUB_OUTPUT"
            git merge --abort
          fi

      - name: Build (on merge success)
        if: steps.merge.outputs.conflict == 'false'
        id: build
        run: |
          cmake -B build \
            -DCMAKE_BUILD_RPATH="@loader_path" \
            -DGGML_METAL=ON \
            -DLLAMA_BUILD_TESTS=ON \
            -DLLAMA_BUILD_EXAMPLES=ON \
            -DLLAMA_FATAL_WARNINGS=ON
          cmake --build build --config Release -j $(sysctl -n hw.logicalcpu)

      - name: Test (on build success)
        if: steps.merge.outputs.conflict == 'false'
        id: test
        run: |
          ctest --test-dir build -L main -E "test-llama-archs" --output-on-failure --timeout 900

      # Benchmark regression check: runs bench-regression-check.py against
      # existing bench-results if a baseline exists. This validates that the
      # most recent benchmark data still passes thresholds after the upstream
      # merge. Full benchmark runs (needle-haystack, multiturn, throughput)
      # require real models and are run manually before the weekly merge.
      # See plan section 7.1.4 for the manual benchmark gate process.
      - name: Benchmark regression check (if baseline exists)
        if: steps.merge.outputs.conflict == 'false' && steps.test.outcome == 'success'
        run: |
          if ls bench-results/20*/manifest.json 1>/dev/null 2>&1; then
            echo "Baseline found — running regression check"
            python3 scripts/bench-regression-check.py \
              --current bench-results \
              --branch upstream-sync \
              --commit "$(git rev-parse --short HEAD)" \
              --out-dir bench-results/upstream-sync || echo "::warning::Benchmark regression check failed"
          else
            echo "No baseline found — skipping regression check"
          fi

      - name: Push upstream-sync (on all success)
        if: steps.merge.outputs.conflict == 'false' && steps.build.outcome == 'success' && steps.test.outcome == 'success'
        run: |
          git push origin upstream-sync --force-with-lease

      - name: Merge into modelai-main
        if: steps.merge.outputs.conflict == 'false' && steps.build.outcome == 'success' && steps.test.outcome == 'success'
        run: |
          git checkout modelai-main
          git merge upstream-sync --no-edit
          git push origin modelai-main

      - name: Open issue on failure
        if: failure() || steps.merge.outputs.conflict == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          UPSTREAM_SHA="$(git rev-parse --short upstream/master 2>/dev/null || echo unknown)"
          BASE_SHA="$(git rev-parse --short origin/modelai-main 2>/dev/null || echo unknown)"
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          if [ "${{ steps.merge.outputs.conflict }}" = "true" ]; then
            TITLE="Upstream Sync: merge conflict ($(date +%Y-%m-%d))"
            read -r -d '' BODY <<EOF || true
          Daily upstream sync failed due to merge conflicts.

          **Upstream:** \`upstream/master\` at \`${UPSTREAM_SHA}\`
          **Base:** \`modelai-main\` at \`${BASE_SHA}\`

          Resolve conflicts manually:
          \`\`\`bash
          git checkout -B upstream-sync origin/modelai-main
          git merge upstream/master
          # resolve conflicts
          git push origin upstream-sync --force-with-lease
          \`\`\`

          ---
          Generated by modelai-upstream-sync workflow.
          EOF
          elif [ "${{ steps.build.outcome }}" = "failure" ]; then
            TITLE="Upstream Sync: build failure ($(date +%Y-%m-%d))"
            read -r -d '' BODY <<EOF || true
          Daily upstream sync merged cleanly but build failed.

          Check the [workflow run](${RUN_URL}) for details.

          ---
          Generated by modelai-upstream-sync workflow.
          EOF
          else
            TITLE="Upstream Sync: test failure ($(date +%Y-%m-%d))"
            read -r -d '' BODY <<EOF || true
          Daily upstream sync merged and built but tests failed.

          Check the [workflow run](${RUN_URL}) for details.

          ---
          Generated by modelai-upstream-sync workflow.
          EOF
          fi

          gh issue create \
            --repo "${{ github.repository }}" \
            --title "$TITLE" \
            --body "$BODY" \
            --label "upstream-sync"
