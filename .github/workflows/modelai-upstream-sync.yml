name: ModelAI Upstream Sync

on:
  schedule:
    # Weekly Saturday 2PM PDT (21:00 UTC)
    - cron: '0 21 * * 6'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: upstream-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          # MODELAI_PAT (admin PAT) bypasses branch protection for the
          # auto-merge step.  Falls back to GITHUB_TOKEN if not set.
          token: ${{ secrets.MODELAI_PAT || secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Fetch upstream
        run: |
          git remote add upstream https://github.com/ggml-org/llama.cpp.git || true
          git fetch upstream master
          git fetch origin modelai-main

      - name: Update upstream-master tracking branch
        run: |
          git branch -f upstream-master upstream/master
          git push origin upstream-master --force-with-lease

      - name: Reset upstream-sync to modelai-main + upstream
        id: merge
        run: |
          set -euo pipefail

          git checkout -B upstream-sync origin/modelai-main
          if git merge upstream/master --no-edit; then
            echo "conflict=false" >> "$GITHUB_OUTPUT"
          else
            echo "conflict=true" >> "$GITHUB_OUTPUT"
            git merge --abort
          fi

      - name: Build (on merge success)
        if: steps.merge.outputs.conflict == 'false'
        id: build
        run: |
          cmake -B build \
            -DCMAKE_BUILD_RPATH="@loader_path" \
            -DGGML_METAL=ON \
            -DLLAMA_BUILD_TESTS=ON \
            -DLLAMA_BUILD_EXAMPLES=ON \
            -DLLAMA_FATAL_WARNINGS=ON
          cmake --build build --config Release -j $(sysctl -n hw.logicalcpu)

      - name: Test (on build success)
        if: steps.merge.outputs.conflict == 'false'
        id: test
        run: |
          ctest --test-dir build -L main -E "test-llama-archs" --output-on-failure --timeout 900

      # Benchmark regression check: runs bench-regression-check.py against
      # existing bench-results if a baseline exists. This validates that the
      # most recent benchmark data still passes thresholds after the upstream
      # merge. Full benchmark runs (needle-haystack, multiturn, throughput)
      # require real models and are run manually before the weekly merge.
      # See plan section 7.1.4 for the manual benchmark gate process.
      - name: Benchmark regression check (if baseline exists)
        if: steps.merge.outputs.conflict == 'false' && steps.test.outcome == 'success'
        run: |
          if ls bench-results/20*/manifest.json 1>/dev/null 2>&1; then
            echo "Baseline found — running regression check"
            python3 scripts/bench-regression-check.py \
              --current bench-results \
              --branch upstream-sync \
              --commit "$(git rev-parse --short HEAD)" \
              --out-dir bench-results/upstream-sync || echo "::warning::Benchmark regression check failed"
          else
            echo "No baseline found — skipping regression check"
          fi

      - name: Push upstream-sync (on all success)
        if: steps.merge.outputs.conflict == 'false' && steps.build.outcome == 'success' && steps.test.outcome == 'success'
        run: |
          git push origin upstream-sync --force-with-lease

      - name: Fast-forward modelai-main
        if: steps.merge.outputs.conflict == 'false' && steps.build.outcome == 'success' && steps.test.outcome == 'success'
        id: modelai_main
        run: |
          set -euo pipefail
          git checkout -B modelai-main origin/modelai-main
          git merge --ff-only upstream-sync

      - name: Rebuild modelai-main and verify llama-server version stamp
        if: steps.modelai_main.outcome == 'success'
        id: modelai_main_rebuild
        run: |
          set -euo pipefail

          cmake -B build \
            -DCMAKE_BUILD_RPATH="@loader_path" \
            -DGGML_METAL=ON \
            -DLLAMA_BUILD_TESTS=ON \
            -DLLAMA_BUILD_EXAMPLES=ON \
            -DLLAMA_FATAL_WARNINGS=ON
          cmake --build build --config Release -j $(sysctl -n hw.logicalcpu)

          HEAD_SHA="$(git rev-parse --short HEAD)"
          VERSION_OUT="$(./build/bin/llama-server --version 2>&1)"

          echo "$VERSION_OUT"
          echo "$VERSION_OUT" | grep -F "(${HEAD_SHA})"

      - name: Verify COT auto-resolves rebuilt llama-server
        if: steps.modelai_main_rebuild.outcome == 'success'
        id: cot_resolver_check
        run: |
          set -euo pipefail

          WORKSPACE_PARENT="$(dirname "$GITHUB_WORKSPACE")"
          COT_CHECKOUT="${WORKSPACE_PARENT}/COT-upstream-sync-check"

          rm -rf "$COT_CHECKOUT"
          git clone --depth 1 https://github.com/jandhyala-dev/cot.git "$COT_CHECKOUT"
          python3 -m pip install --disable-pip-version-check httpx pyyaml

          unset COT_LLAMA_SERVER
          rm -f "$HOME/.cot/engines.yaml"

          COT_CHECKOUT="$COT_CHECKOUT" python3 - <<'PY'
          import sys
          import os
          from pathlib import Path

          sys.path.insert(0, str((Path(os.environ["COT_CHECKOUT"]) / "src").resolve()))

          from cot.inference.lifecycle import InferenceServer
          from cot.inference.server_binary import (
              find_llama_server_binary,
              get_binary_repo_status,
          )

          expected = (Path("build/bin/llama-server")).resolve()
          resolved = InferenceServer.find_binary().resolve()
          assert resolved == expected, f"expected {expected}, got {resolved}"

          binary, source = find_llama_server_binary(Path.home() / ".cot")
          assert binary is not None, "resolver returned no binary"
          assert binary.resolve() == expected, f"helper resolved {binary}, expected {expected}"
          assert source == "workspace modelai-llama.cpp build", f"unexpected source: {source}"

          fresh, built_sha, head_sha, repo_root = get_binary_repo_status(binary)
          assert fresh is True, (
              f"binary freshness check failed: built_sha={built_sha}, "
              f"head_sha={head_sha}, repo_root={repo_root}"
          )

          print(f"COT resolves {resolved}")
          print(f"COT source  {source}")
          print(f"Binary stamp matches repo HEAD ({head_sha})")
          PY

          rm -rf "$COT_CHECKOUT"

      - name: Push modelai-main
        if: steps.cot_resolver_check.outcome == 'success'
        id: push_modelai_main
        run: |
          git push origin modelai-main

      - name: Notify — merged to modelai-main
        if: steps.push_modelai_main.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          UPSTREAM_SHA="$(git rev-parse --short upstream/master)"
          MODELAI_SHA="$(git rev-parse --short HEAD)"
          gh issue create \
            --repo "${{ github.repository }}" \
            --title "Upstream Sync: merged ($(date +%Y-%m-%d))" \
            --label "upstream-sync" \
            --body "$(cat <<EOF
          ## upstream-sync merged successfully

          **Upstream:** \`upstream/master\` at \`${UPSTREAM_SHA}\`
          **modelai-main:** \`${MODELAI_SHA}\`
          **Build:** passed | **Tests:** passed | **llama-server stamp:** verified on \`modelai-main\`
          **COT resolver:** verified to auto-pick the rebuilt \`modelai-main\` binary

          If you want your developer machine's local binary to match \`modelai-main\` too, rebuild locally:
          \`\`\`bash
          git fetch origin
          git checkout modelai-main
          git pull --ff-only
          cmake -B build \\
            -DCMAKE_BUILD_RPATH='@loader_path' \\
            -DGGML_METAL=ON \\
            -DLLAMA_BUILD_TESTS=ON \\
            -DLLAMA_BUILD_EXAMPLES=ON \\
            -DLLAMA_FATAL_WARNINGS=ON
          cmake --build build --config Release -j \$(sysctl -n hw.logicalcpu)
          ./build/bin/llama-server --version
          \`\`\`

          ---
          Generated by modelai-upstream-sync workflow.
          EOF
          )"

      - name: Open issue on failure
        if: failure() || steps.merge.outputs.conflict == 'true'
        env:
          GH_TOKEN: ${{ secrets.MODELAI_PAT || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          UPSTREAM_SHA="$(git rev-parse --short upstream/master 2>/dev/null || echo unknown)"
          BASE_SHA="$(git rev-parse --short origin/modelai-main 2>/dev/null || echo unknown)"
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          if [ "${{ steps.merge.outputs.conflict }}" = "true" ]; then
            TITLE="Upstream Sync: merge conflict ($(date +%Y-%m-%d))"
            read -r -d '' BODY <<EOF || true
          Weekly upstream sync failed due to merge conflicts.

          **Upstream:** \`upstream/master\` at \`${UPSTREAM_SHA}\`
          **Base:** \`modelai-main\` at \`${BASE_SHA}\`

          Resolve conflicts manually:
          \`\`\`bash
          git checkout -B upstream-sync origin/modelai-main
          git merge upstream/master
          # resolve conflicts
          git push origin upstream-sync --force-with-lease
          \`\`\`

          ---
          Generated by modelai-upstream-sync workflow.
          EOF
          elif [ "${{ steps.build.outcome }}" = "failure" ]; then
            TITLE="Upstream Sync: build failure ($(date +%Y-%m-%d))"
            read -r -d '' BODY <<EOF || true
          Weekly upstream sync merged cleanly but build failed.

          Check the [workflow run](${RUN_URL}) for details.

          ---
          Generated by modelai-upstream-sync workflow.
          EOF
          elif [ "${{ steps.modelai_main_rebuild.outcome }}" = "failure" ]; then
            TITLE="Upstream Sync: modelai-main rebuild failure ($(date +%Y-%m-%d))"
            read -r -d '' BODY <<EOF || true
          Weekly upstream sync merged, built, and tested on \`upstream-sync\`, but the post-merge
          \`modelai-main\` rebuild or \`llama-server --version\` stamp verification failed.

          Check the [workflow run](${RUN_URL}) for details.

          ---
          Generated by modelai-upstream-sync workflow.
          EOF
          elif [ "${{ steps.cot_resolver_check.outcome }}" = "failure" ]; then
            TITLE="Upstream Sync: COT resolver verification failure ($(date +%Y-%m-%d))"
            read -r -d '' BODY <<EOF || true
          Weekly upstream sync rebuilt \`modelai-main\`, but COT did not auto-resolve the freshly built
          \`build/bin/llama-server\` in CI.

          Check the [workflow run](${RUN_URL}) for details.

          ---
          Generated by modelai-upstream-sync workflow.
          EOF
          elif [ "${{ steps.push_modelai_main.outcome }}" = "failure" ]; then
            TITLE="Upstream Sync: modelai-main push failure ($(date +%Y-%m-%d))"
            read -r -d '' BODY <<EOF || true
          Weekly upstream sync rebuilt successfully, but pushing \`modelai-main\` failed.

          Check the [workflow run](${RUN_URL}) for details.

          ---
          Generated by modelai-upstream-sync workflow.
          EOF
          else
            TITLE="Upstream Sync: test failure ($(date +%Y-%m-%d))"
            read -r -d '' BODY <<EOF || true
          Weekly upstream sync merged and built but tests failed.

          Check the [workflow run](${RUN_URL}) for details.

          ---
          Generated by modelai-upstream-sync workflow.
          EOF
          fi

          gh issue create \
            --repo "${{ github.repository }}" \
            --title "$TITLE" \
            --body "$BODY" \
            --label "upstream-sync"
