name: modelai-upstream-watch

on:
  schedule:
    # Saturday 2 PM Mountain Time (8 PM UTC in winter / 8 PM UTC in summer)
    # MT is UTC-7 (MDT) or UTC-6 (MST). Using 20:00 UTC = 2 PM MDT / 1 PM MST.
    - cron: '0 20 * * 6'
  workflow_dispatch: # allow manual trigger

permissions:
  issues: write

jobs:
  upstream-watch:
    runs-on: ubuntu-latest
    steps:
      - name: Check upstream KV cache activity
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          SINCE=$(date -u -d '7 days ago' +%Y-%m-%dT%H:%M:%SZ)
          REPORT=""

          # 1. Open PRs mentioning "kv cache"
          echo "Checking open PRs..."
          KV_PRS=$(gh search prs --repo ggml-org/llama.cpp --state open -q "kv cache" --json number,title --limit 20 2>/dev/null || echo "[]")
          KV_PR_COUNT=$(echo "$KV_PRS" | jq 'length')

          if [ "$KV_PR_COUNT" -gt 0 ]; then
            REPORT+="## Open PRs mentioning 'kv cache'\n\n"
            REPORT+=$(echo "$KV_PRS" | jq -r '.[] | "- #\(.number): \(.title)"')
            REPORT+="\n\n"
          fi

          # 2. Recent commits to KV cache files
          echo "Checking recent commits to KV cache files..."
          KV_FILES=("src/llama-kv-cache.cpp" "src/llama-kv-cache.h" "src/llama-kv-cache-iswa.cpp" "src/llama-kv-cache-iswa.h")
          COMMIT_REPORT=""

          for FILE in "${KV_FILES[@]}"; do
            COMMITS=$(gh api "repos/ggml-org/llama.cpp/commits?path=${FILE}&since=${SINCE}" --jq '.[].commit.message | split("\n")[0]' 2>/dev/null || echo "")
            if [ -n "$COMMITS" ]; then
              COMMIT_REPORT+="### ${FILE}\n"
              while IFS= read -r line; do
                COMMIT_REPORT+="- ${line}\n"
              done <<< "$COMMITS"
              COMMIT_REPORT+="\n"
            fi
          done

          if [ -n "$COMMIT_REPORT" ]; then
            REPORT+="## Upstream commits to KV cache files (last 7 days)\n\n"
            REPORT+="$COMMIT_REPORT"
          fi

          # 3. Create issue if anything found
          if [ -n "$REPORT" ]; then
            echo "Findings detected — creating issue."
            BODY=$(printf "Weekly upstream KV cache watch — $(date +%Y-%m-%d)\n\n${REPORT}\n\n---\nGenerated by modelai-upstream-watch workflow.")
            gh issue create \
              --repo jandhyala-dev/modelai-llama.cpp \
              --title "Upstream Watch: KV cache activity detected ($(date +%Y-%m-%d))" \
              --body "$BODY" \
              --label "upstream-watch"
          else
            echo "No KV cache activity found. No issue created."
          fi
