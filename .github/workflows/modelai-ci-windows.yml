name: ModelAI CI Windows

on:
  workflow_dispatch:
  push:
    branches:
      - modelai-main
      - upstream-master
      - kv-compact-*
      - feature/**
    paths:
      - '.github/workflows/modelai-ci-windows.yml'
      - '**/CMakeLists.txt'
      - '**/*.cmake'
      - 'ggml/**'
      - 'include/**'
      - 'src/**'
      - 'common/**'
      - 'tests/**'
      - 'tools/**'
      - 'examples/**'
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/modelai-ci-windows.yml'
      - '**/CMakeLists.txt'
      - '**/*.cmake'
      - 'ggml/**'
      - 'include/**'
      - 'src/**'
      - 'common/**'
      - 'tests/**'
      - 'tools/**'
      - 'examples/**'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  build-windows-cpu:
    name: build-windows-cpu
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Fetch upstream provenance branch
        run: |
          git fetch --no-tags origin refs/heads/upstream-master:refs/remotes/origin/upstream-master

      - name: Configure
        run: |
          cmake -B build -G "Visual Studio 17 2022" -A x64 `
            -DBUILD_SHARED_LIBS=OFF `
            -DLLAMA_BUILD_TESTS=OFF `
            -DLLAMA_BUILD_EXAMPLES=ON `
            -DLLAMA_FATAL_WARNINGS=OFF

      - name: Build
        run: |
          cmake --build build --config Release -j $env:NUMBER_OF_PROCESSORS

      # Tests disabled: KV compaction tests require models not available in CI.
      # Windows CI validates build-only. Full tests run on macOS/Linux.
      # - name: Test
      #   run: |
      #     ctest --test-dir build -L main --output-on-failure --timeout 900
