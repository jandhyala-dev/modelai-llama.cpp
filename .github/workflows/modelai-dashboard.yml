name: ModelAI Dashboard Update

on:
  workflow_dispatch:
  push:
    branches: [modelai-main]
    paths:
      - 'site/**'
      - 'bench-results/**'
      - 'scripts/update-dashboard-data.py'
  workflow_run:
    workflows: ["ModelAI CI", "ModelAI Perf Smoke"]
    types: [completed]
    branches: [modelai-main]

concurrency:
  group: dashboard-update
  cancel-in-progress: true

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  update-data:
    name: update-dashboard-data
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push' || github.event.workflow_run.conclusion == 'success'
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Generate dashboard data
        run: |
          python3 scripts/update-dashboard-data.py \
            --bench-dir bench-results \
            --baseline bench-results/perf-baseline.json \
            --output bench-results/history.jsonl

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet bench-results/history.jsonl 2>/dev/null; then
            echo "No changes to history.jsonl"
          else
            git add bench-results/history.jsonl
            git commit -m "chore: update dashboard data [skip ci]"
            git push
          fi

  deploy-site:
    name: deploy-site
    runs-on: ubuntu-latest
    needs: update-data
    if: always() && (needs.update-data.result == 'success' || needs.update-data.result == 'skipped')
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
